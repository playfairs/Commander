name: CI / Build

on:
  push: {}
  release:
    types: [ published ]

jobs:
  checks:
    name: Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Resolve packages
        run: swift package resolve
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release

  publish-release:
    name: Build & Publish Release Artifacts
    needs: checks
    if: github.event_name == 'release'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --prune --unshallow || true
      - name: Run checks (without just)
        run: |
          swift --version
          swift package resolve
          swift build -c release
          swift test -c release
      - name: Make scripts executable
        run: |
          chmod +x ./scripts/*.sh || true
      - name: Build app bundle
        run: ./scripts/build_app.sh "${{ github.event.release.tag_name }}" build
      - name: Create PKG
        run: ./scripts/create_pkg.sh "${{ github.event.release.tag_name }}" build
      - name: Create DMG
        run: ./scripts/create_dmg.sh "${{ github.event.release.tag_name }}" build
      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Commander-${{ github.event.release.tag_name }}.dmg
          path: build/Commander-${{ github.event.release.tag_name }}.dmg
      - name: Upload PKG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Commander-${{ github.event.release.tag_name }}.pkg
          path: build/Commander-${{ github.event.release.tag_name }}.pkg
