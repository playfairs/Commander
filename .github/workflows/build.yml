name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build, Test, and Package
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show Swift version
        run: swift --version

      - name: Build release executable
        run: swift build -c release

      - name: Run tests
        run: swift test --enable-test-discovery

      - name: Create app bundle
        run: bash ./tools/make_app_bundle.sh

      - name: Create DMG and PKG
        run: bash ./tools/make_dmg_and_pkg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: commander-dmg-${{ github.sha }}
          path: dist/Commander-*.dmg
          if-no-files-found: error

      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: commander-pkg-${{ github.sha }}
          path: dist/packages/Commander.pkg
          if-no-files-found: error
