name: Build macOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up permissions for scripts
        run: |
          chmod +x tools/*.sh || true

      - name: Build app bundle
        run: |
          ./tools/make_app_bundle.sh

      - name: Create DMG and PKG
        run: |
          ./tools/make_dmg_and_pkg.sh

      - name: Ensure GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi

      - name: Publish Release and upload assets
        run: |
          TAG_NAME="${{ github.ref_name }}"
          DMG="dist/Commander-${TAG_NAME}.dmg"
          PKG="dist/packages/Commander-${TAG_NAME}.pkg"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$DMG" "$PKG" --clobber
          else
            gh release create "$TAG_NAME" "$DMG" "$PKG" \
              --title "$TAG_NAME" \
              --notes "Automated build for $TAG_NAME"
          fi
