name: CI / Build

on:
  push: {}
  release:
    types: [ published ]

jobs:
  checks:
    name: Checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Resolve packages
        run: swift package resolve
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test -c release

  build-release-artifacts:
    name: Build release artifacts
    needs: checks
    if: github.event_name == 'release'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tags
        run: git fetch --prune --unshallow || true
      - name: Run checks (without just)
        run: |
          swift --version
          swift package resolve
          swift build -c release
          swift test -c release
      - name: Make scripts executable
        run: |
          chmod +x ./scripts/*.sh || true
      - name: Build app bundle
        run: ./scripts/build_app.sh "${{ github.event.release.tag_name }}" build
      - name: Create PKG
        run: ./scripts/create_pkg.sh "${{ github.event.release.tag_name }}" build
      - name: Create DMG
        run: ./scripts/create_dmg.sh "${{ github.event.release.tag_name }}" build
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v6
        with:
          name: Commander-dmg-${{ github.sha }}
          path: build/Commander-${{ github.event.release.tag_name }}.dmg
          if-no-files-found: error
      - name: Upload PKG artifact
        uses: actions/upload-artifact@v6
        with:
          name: Commander-pkg-${{ github.sha }}
          path: build/Commander-${{ github.event.release.tag_name }}.pkg
          if-no-files-found: error

  release:
    name: Create GitHub Release and attach artifacts
    needs: build-release-artifacts
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: Commander-dmg-${{ github.sha }}
          path: release
      - name: Download PKG artifact
        uses: actions/download-artifact@v4
        with:
          name: Commander-pkg-${{ github.sha }}
          path: release
      - name: Create release (attach artifacts)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Commander-${{ github.event.release.tag_name }}.dmg
            release/Commander-${{ github.event.release.tag_name }}.pkg
          name: Commander ${{ github.event.release.tag_name }}
          draft: false
          prerelease: false
