name: Build macOS Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up permissions for scripts
        run: |
          chmod +x tools/*.sh || true

      - name: Build app bundle
        run: |
          ./tools/make_app_bundle.sh

      - name: Create DMG and PKG
        run: |
          ./tools/make_dmg_and_pkg.sh

      - name: Upload DMG
        uses: actions/upload-release-asset@v1
        with:
          release_id: ${{ github.event.release.id }}
          asset_path: dist/Commander-${{ github.event.release.tag_name }}.dmg
          asset_name: Commander-${{ github.event.release.tag_name }}.dmg
          asset_content_type: application/x-apple-diskimage

      - name: Upload PKG
        uses: actions/upload-release-asset@v1
        with:
          release_id: ${{ github.event.release.id }}
          asset_path: dist/packages/Commander-${{ github.event.release.tag_name }}.pkg
          asset_name: Commander-${{ github.event.release.tag_name }}.pkg
          asset_content_type: application/octet-stream
