name: Build (Release)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up permissions for scripts
        run: |
          chmod +x tools/*.sh || true

      - name: Build and package
        run: |
          ./tools/make_app_bundle.sh
          ./tools/make_dmg_and_pkg.sh

      - name: Remove quarantine from artifacts
        run: |
          xattr -rd com.apple.quarantine dist/* 2>/dev/null || true

      - name: List generated packages
        run: |
          echo "Generated files in dist:"
          find dist -maxdepth 2 -type f | sort

      - name: Upload DMG and PKG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: Automated build for ${{ github.ref_name }}
          files: |
            dist/Commander-*.dmg
            dist/packages/Commander.pkg
          fail_on_unmatched_files: false
