name: Build (Release)

on: [push, pull_request]

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up permissions for scripts
        run: |
          chmod +x tools/*.sh || true

      - name: Build and package
        run: |
          ./tools/make_app_bundle.sh
          ./tools/make_dmg_and_pkg.sh

      - name: Package app bundle
        run: |
          if [ -d dist/Commander.app ]; then
            tar -czf dist/Commander.app.tar.gz -C dist Commander.app
          fi

      - name: Remove quarantine from artifacts
        run: |
          xattr -rd com.apple.quarantine dist/* 2>/dev/null || true

      - uses: actions/upload-artifact@v6
        with:
          name: commander-release-macos-app-${{ github.sha }}
          path: dist/Commander.app.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: commander-release-macos-dmg-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: commander-release-macos-pkg-${{ github.sha }}
          path: dist/packages/*.pkg
          if-no-files-found: error
