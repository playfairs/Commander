name: Build macOS Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up permissions for scripts
        run: |
          chmod +x tools/*.sh || true

      - name: Build app bundle
        run: |
          ./tools/make_app_bundle.sh

      - name: Create DMG and PKG
        run: |
          ./tools/make_dmg_and_pkg.sh

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: "Automated build for ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/Commander-${{ github.ref_name }}.dmg
          asset_name: Commander-${{ github.ref_name }}.dmg
          asset_content_type: application/x-apple-diskimage

      - name: Upload PKG
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/packages/Commander-${{ github.ref_name }}.pkg
          asset_name: Commander-${{ github.ref_name }}.pkg
          asset_content_type: application/octet-stream
